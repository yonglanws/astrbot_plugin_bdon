{# Shared styles for the 卡池 detail and simulation result pages. #}
<style>
  .gacha-page{font-size:16px}
  .gacha-page .page-title{font-size:32px}
  .gacha-page .page-sub{font-size:16.5px}
  .gacha-page .page-hint{font-size:15px}
  .gacha-page .chip{font-size:15px}
  .gacha-page .kicker{font-size:13.5px}
  .gacha-page .section-head{margin:20px 2px 10px}
  .gacha-page .section-title{font-size:21px}
  .gacha-page .section-sub{max-width:60%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

  /* ---------- search results ---------- */
  .gacha-grid{display:flex;flex-wrap:wrap;justify-content:center;gap:14px;width:100%}
  .gacha-grid>.gacha-card{width:calc(50% - 7px);max-width:520px}
  .gacha-card{display:flex;flex-direction:column;background:var(--surface);border:1px solid var(--outline);border-radius:var(--radius-xl);overflow:hidden;box-shadow:var(--shadow);min-width:0}
  .gacha-cover{position:relative;aspect-ratio:7/3;overflow:hidden;background:linear-gradient(135deg,color-mix(in srgb,var(--accent) 42%, #dfe7f1),color-mix(in srgb,var(--accent) 18%, #ffffff))}
  .gacha-cover-img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:block}
  .gacha-cover-shade{position:absolute;inset:0;background:linear-gradient(180deg,rgba(12,16,22,.02) 32%,rgba(12,16,22,.58) 100%)}
  .gacha-cover .state-pill{position:absolute;top:10px;left:10px;z-index:2}
  .gacha-limited{position:absolute;top:10px;right:46px;z-index:2;padding:3px 8px;border-radius:6px;background:linear-gradient(135deg,#ff7a93,#e0445e);color:#fff;font-size:12.5px;font-weight:600;letter-spacing:.4px;box-shadow:0 2px 6px rgba(224,68,94,.3)}
  .gacha-id{position:absolute;top:10px;right:10px;z-index:2;padding:3px 8px;border-radius:6px;background:rgba(16,20,26,.55);color:#fff;font-size:13px;font-weight:600;font-variant-numeric:tabular-nums}
  .gacha-body{padding:12px 15px 14px;display:flex;flex-direction:column;flex:1;min-width:0}
  .gacha-name{font-size:21px;font-weight:600;line-height:1.35;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;min-height:1.35em}
  .gacha-period{font-size:14.5px;color:var(--muted);margin-top:4px;font-variant-numeric:tabular-nums}
  .gacha-chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
  .gacha-pickups{display:flex;flex-wrap:wrap;gap:6px;margin-top:9px;min-width:0}
  .gacha-pickups .char-chip{max-width:190px;min-width:0}
  .gacha-pickups .char-chip>span:last-child{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .search-note{margin-top:12px;font-size:14.5px;line-height:1.6;color:var(--faint);text-align:center}

  /* ---------- detail hero ---------- */
  .gacha-hero{position:relative;z-index:0;min-height:284px;border-radius:var(--radius-xl);overflow:hidden;display:flex;align-items:flex-end;margin-top:2px;background:linear-gradient(135deg,color-mix(in srgb,var(--accent) 82%, #17181a),color-mix(in srgb,var(--accent) 42%, #4c9df0));box-shadow:0 14px 34px color-mix(in srgb,var(--accent) 24%, transparent)}
  .gacha-hero .hero-bg{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:block;z-index:0}
  .gacha-hero::after{content:"";position:absolute;inset:0;z-index:1;background:linear-gradient(180deg,rgba(12,16,22,.06) 12%,rgba(12,16,22,.42) 42%,rgba(12,16,22,.88) 100%)}
  .gacha-hero-inner{position:relative;z-index:2;width:100%;padding:26px 28px 22px}
  .gacha-logo{height:54px;width:auto;max-width:min(70%,440px);object-fit:contain;display:block;margin-bottom:9px;filter:drop-shadow(0 3px 12px rgba(0,0,0,.4))}
  .gacha-title{font-size:36px;line-height:1.18;font-weight:600;color:#fff;margin:0;letter-spacing:.2px;text-shadow:0 2px 12px rgba(0,0,0,.38)}
  .gacha-meta{display:flex;flex-wrap:wrap;gap:7px;margin-top:12px}
  .gacha-meta .chip{background:rgba(255,255,255,.15);border-color:rgba(255,255,255,.26);color:#fff}
  .gacha-state{position:absolute;top:15px;right:16px;z-index:3;display:flex;gap:7px;align-items:center}
  .gacha-info{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px;margin-top:14px}
  .gacha-desc{margin-top:14px;background:var(--surface);border:1px solid var(--outline);border-radius:var(--radius-lg);padding:14px 18px;box-shadow:var(--shadow-soft);font-size:16px;line-height:1.75;color:var(--muted);white-space:pre-line}

  /* ---------- two-column detail ---------- */
  .gacha-columns{display:grid;grid-template-columns:minmax(0,1.55fr) minmax(0,1fr);gap:16px;align-items:start;margin-top:4px}
  .gacha-main,.gacha-side{min-width:0}
  .gacha-panel{background:var(--surface);border:1px solid var(--outline);border-radius:var(--radius-lg);padding:13px 17px;box-shadow:var(--shadow-soft)}
  .panel-title{font-size:17px;font-weight:600;margin-bottom:7px}

  /* ---------- rates ---------- */
  .rate-row{display:grid;grid-template-columns:170px minmax(0,1fr) 70px 130px;gap:12px;align-items:center;padding:8px 0;border-bottom:1px solid var(--outline-soft)}
  .rate-row:last-child{border-bottom:0}
  .rate-row.compact{grid-template-columns:190px minmax(0,1fr) 70px}
  .rate-kind{display:flex;align-items:center;gap:7px;min-width:0}
  .rate-icon{height:22px;width:auto;max-width:52px;object-fit:contain;flex:0 0 auto}
  .rate-kind-label{font-size:16px;font-weight:600;white-space:nowrap}
  .rate-rarity{font-size:14.5px;font-weight:600;white-space:nowrap}
  .rate-bar{height:9px;border-radius:999px;background:var(--surface-3);overflow:hidden;min-width:0}
  .rate-bar span{display:block;height:100%;border-radius:999px}
  .rate-value{font-size:18px;font-weight:600;text-align:right;font-variant-numeric:tabular-nums;color:var(--accent)}
  .rate-count{font-size:14px;color:var(--faint);text-align:right;white-space:nowrap}
  .rate-note{margin-top:10px;padding-top:9px;border-top:1px solid var(--outline-soft);font-size:14px;line-height:1.6;color:var(--faint)}

  /* ---------- pickups ---------- */
  .pickup-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:12px}
  .pickup-card{background:var(--surface);border:1px solid var(--outline);border-radius:var(--radius-md);overflow:hidden;box-shadow:var(--shadow-soft);min-width:0}
  .pickup-cover{position:relative;aspect-ratio:1/1;background:var(--surface-3)}
  .pickup-cover .pic{position:absolute;inset:0}
  .pickup-cover .pic-img{object-fit:cover}
  .pickup-tag{position:absolute;left:8px;top:8px;z-index:2;padding:2px 7px;border-radius:5px;background:linear-gradient(135deg,#ff8a5c,#e05a7a);color:#fff;font-size:11.5px;font-weight:600;letter-spacing:.5px}
  .pickup-body{padding:9px 11px 11px}
  .pickup-title{font-size:16px;font-weight:600;line-height:1.4;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;min-height:2.8em}
  .pickup-sub{font-size:14px;color:var(--muted);margin-top:2px;white-space:normal;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
  /* A single Pick Up card gets a horizontal feature so the section does not
     leave two thirds of the row empty. */
  .pickup-feature{display:grid;grid-template-columns:220px minmax(0,1fr);gap:18px;align-items:center;background:var(--surface);border:1px solid var(--outline);border-radius:var(--radius-lg);padding:14px 18px 14px 14px;box-shadow:var(--shadow-soft)}
  .pickup-feature .pickup-cover{width:220px;aspect-ratio:1/1;border-radius:12px;overflow:hidden}
  .pickup-feature .pickup-info{min-width:0}
  .pickup-feature .pickup-title{font-size:24px;font-weight:600;line-height:1.35;display:block;min-height:0}
  .pickup-feature .pickup-sub{font-size:17px;margin-top:4px}
  .pickup-tags{display:flex;flex-wrap:wrap;align-items:center;gap:8px;margin-top:12px}
  .pickup-note{font-size:15px;line-height:1.6;color:var(--faint);margin-top:10px}

  /* ---------- options / bonuses ---------- */
  .option-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
  .option-card{background:var(--surface);border:1px solid var(--outline);border-radius:var(--radius-md);padding:11px 13px;box-shadow:var(--shadow-soft);min-width:0}
  .option-label{font-size:15.5px;font-weight:600}
  .option-price{font-size:23px;font-weight:600;color:var(--accent);font-variant-numeric:tabular-nums;line-height:1.25;margin-top:2px}
  .option-price small{font-size:13px;color:var(--faint);font-weight:400;margin-left:4px}
  .option-tags{display:flex;flex-wrap:wrap;gap:5px;margin-top:7px}
  .option-tags .chip{font-size:13px;padding:3px 8px}
  .bonus-panel{background:var(--surface);border:1px solid var(--outline);border-radius:var(--radius-lg);padding:5px 15px 7px;box-shadow:var(--shadow-soft)}
  .bonus-row{display:flex;align-items:center;gap:10px;padding:8px 0;border-bottom:1px solid var(--outline-soft)}
  .bonus-row:last-child{border-bottom:0}
  .bonus-thumb{width:46px;height:46px;border-radius:10px;overflow:hidden;flex:0 0 46px;background:var(--surface-2);display:grid;place-items:center;color:var(--faint)}
  .bonus-thumb img{width:100%;height:100%;object-fit:contain;display:block}
  .bonus-main{min-width:0;flex:1}
  .bonus-name{font-size:15.5px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .bonus-sub{font-size:13.5px;color:var(--faint);margin-top:1px}
  .bonus-rate{font-size:14.5px;font-weight:600;color:var(--accent);white-space:nowrap;font-variant-numeric:tabular-nums;background:color-mix(in srgb,var(--accent) 8%, #ffffff);border:1px solid color-mix(in srgb,var(--accent) 18%, #ffffff);border-radius:7px;padding:3px 7px}

  /* ---------- simulator hint ---------- */
  .sim-panel{margin-top:14px;background:linear-gradient(135deg,color-mix(in srgb,var(--accent) 9%, #ffffff),color-mix(in srgb,var(--accent) 4%, #ffffff));border:1px solid color-mix(in srgb,var(--accent) 22%, #ffffff);border-radius:var(--radius-lg);padding:13px 16px}
  .sim-title{font-size:17px;font-weight:600;color:color-mix(in srgb,var(--accent) 78%, #17181a)}
  .sim-line{font-size:15px;color:var(--muted);margin-top:6px;line-height:1.5}
  .sim-line b{color:var(--accent);font-weight:600}
  .sim-note{margin-top:9px;font-size:14px;line-height:1.6;color:var(--faint)}

  /* ---------- draw result ---------- */
  .draw-grid{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:12px;margin-top:4px}
  .draw-card{background:var(--surface);border:1px solid var(--outline);border-radius:var(--radius-md);overflow:hidden;box-shadow:var(--shadow-soft);min-width:0}
  .draw-card.is-pickup{border-color:color-mix(in srgb,var(--rarity) 55%, #ffffff);box-shadow:0 0 0 2px color-mix(in srgb,var(--rarity) 20%, transparent),var(--shadow-soft)}
  .draw-cover{position:relative;aspect-ratio:1/1;background:var(--surface-3)}
  .draw-cover .pic{position:absolute;inset:0}
  .draw-cover .pic-img{object-fit:cover}
  .draw-index{position:absolute;left:7px;top:7px;z-index:2;width:22px;height:22px;border-radius:50%;background:rgba(16,20,26,.62);color:#fff;font-size:12.5px;font-weight:600;display:grid;place-items:center;font-variant-numeric:tabular-nums}
  .pickup-badge{position:absolute;right:7px;top:7px;z-index:2;padding:2px 7px;border-radius:5px;background:linear-gradient(135deg,#ff8a5c,#e05a7a);color:#fff;font-size:11px;font-weight:600;letter-spacing:.4px;box-shadow:0 2px 6px rgba(224,68,94,.28)}
  .draw-body{padding:8px 10px 10px;min-width:0}
  .draw-rarity{font-size:13px;font-weight:600;color:var(--rarity);letter-spacing:.2px}
  .draw-card .draw-name{font-size:15.5px;font-weight:600;line-height:1.4;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;min-height:2.8em;margin-top:2px}
  .draw-card .draw-sub{font-size:13.5px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

  .draw-single{display:grid;grid-template-columns:minmax(320px,380px) minmax(0,1fr);gap:18px;align-items:start}
  .draw-art-card{position:relative;background:var(--surface);border:1px solid var(--outline);border-radius:var(--radius-xl);overflow:hidden;box-shadow:var(--shadow)}
  .draw-art{position:relative;background:var(--surface-3)}
  .draw-art.portrait{aspect-ratio:3/4}
  .draw-art.wide{aspect-ratio:16/9;background:#fff}
  .draw-art.square{aspect-ratio:1/1;background:#fff}
  .draw-art .pic{position:absolute;inset:0}
  .draw-art .pic-img{object-fit:cover}
  .draw-art.wide .pic-img,.draw-art.square .pic-img{object-fit:contain;background:#fff}
  .draw-art-badge{position:absolute;top:12px;left:12px;z-index:2;display:flex;gap:7px;align-items:center}
  .draw-single-info{background:var(--surface);border:1px solid var(--outline);border-radius:var(--radius-xl);padding:22px 24px;box-shadow:var(--shadow);min-width:0}
  .draw-kicker{font-size:13px;color:var(--accent);letter-spacing:.14em;font-weight:600;text-transform:uppercase}
  .draw-single-info .draw-name{font-size:30px;font-weight:600;line-height:1.3;margin-top:4px;min-height:0;-webkit-line-clamp:unset}
  .draw-single-info .draw-sub{font-size:18px;color:var(--muted);margin-top:4px}
  .draw-meta{display:flex;flex-wrap:wrap;gap:7px;margin-top:12px}
  .draw-stats{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:10px;margin-top:18px;padding-top:14px;border-top:1px solid var(--outline-soft)}
  .draw-stats .stat-label{font-size:14px;color:var(--faint)}
  .draw-stats .stat-value{font-size:26px;font-weight:600;line-height:1.2;font-variant-numeric:tabular-nums}
  .draw-stats .stat-note{font-size:13.5px;color:var(--muted)}

  .result-strip{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:10px;margin-top:16px}
  .result-stat{background:var(--surface);border:1px solid var(--outline);border-radius:var(--radius-md);padding:10px 14px;box-shadow:var(--shadow-soft);min-width:0}
  .result-stat span{font-size:14px;color:var(--faint)}
  .result-stat b{display:block;font-size:26px;font-weight:600;line-height:1.2;font-variant-numeric:tabular-nums}
  .result-stat small{font-size:14px;color:var(--muted)}
  .result-columns{display:grid;grid-template-columns:minmax(0,1.35fr) minmax(0,1fr);gap:14px;margin-top:14px}
  .rarity-strip{display:flex;flex-wrap:wrap;gap:7px}
  .rarity-chip{padding:6px 11px;border-radius:999px;font-size:14px;font-weight:600;color:color-mix(in srgb,var(--rarity) 78%, #17181a);background:color-mix(in srgb,var(--rarity) 9%, #ffffff);border:1px solid color-mix(in srgb,var(--rarity) 24%, #ffffff);white-space:nowrap}
</style>
