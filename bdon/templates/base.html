<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width={{ page_width or 1080 }}">
<title>{{ page_title or '汐见萤Bot · Our Notes' }}</title>
<style>
  :root{
    --bg:#eef1f5;
    --surface:#ffffff;
    --surface-2:#f5f8fb;
    --surface-3:#e9eef4;
    --text:#16181b;
    --muted:#535b65;
    --faint:#858d97;
    --outline:#dfe5ec;
    --outline-soft:#ebeff4;
    --primary:#0072c2;
    --primary-deep:#00528e;
    --primary-soft:#e6f1fd;
    --accent:{{ accent or '#0072c2' }};
    --radius-xl:22px;
    --radius-lg:16px;
    --radius-md:12px;
    --shadow:0 10px 28px rgba(23,24,26,.06);
    --shadow-soft:0 3px 12px rgba(23,24,26,.045);
    --page-width:{{ page_width or 1080 }}px;
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0}
  body{
    width:100%;
    color:var(--text);
    font-family:"MiSansEmbedded","Noto Sans CJK SC","Noto Sans SC","Source Han Sans SC","PingFang SC","Microsoft YaHei",sans-serif;
    font-size:15px;
    line-height:1.6;
    -webkit-font-smoothing:antialiased;
    background:var(--bg);
  }
  /* A fixed canvas keeps every page the same width. The previous max-content
     layout let a wide page overflow its viewport, which produced inconsistent
     image widths and a band of empty background on the right. */
  .page{
    width:var(--page-width);max-width:100%;margin:0 auto;
    padding:18px 20px 14px;
    background:
      radial-gradient(circle at 8% -6%, color-mix(in srgb, var(--accent) 12%, transparent), transparent 32%),
      radial-gradient(circle at 96% 0%, rgba(76,157,240,.10), transparent 28%),
      radial-gradient(circle at 50% 108%, rgba(255,136,153,.07), transparent 36%),
      var(--bg);
  }
  /* ---------- shared ---------- */
  .chip{
    display:inline-flex;align-items:center;gap:6px;
    padding:5px 11px;border-radius:999px;
    background:var(--surface-2);border:1px solid var(--outline-soft);
    font-size:13px;color:var(--muted);white-space:nowrap;
  }
  .chip .dot{width:7px;height:7px;border-radius:50%;background:var(--band,var(--primary));flex:0 0 7px}
  .band-chip{color:color-mix(in srgb,var(--band) 70%, #17181a);background:color-mix(in srgb,var(--band) 8%, #ffffff);border-color:color-mix(in srgb,var(--band) 20%, #ffffff)}
  .attr-chip{color:color-mix(in srgb,var(--attr) 72%, #17181a);background:color-mix(in srgb,var(--attr) 9%, #ffffff);border-color:color-mix(in srgb,var(--attr) 24%, #ffffff)}
  .attr-chip .dot{background:var(--attr)}
  .attr-chip .attr-icon{height:16px;width:16px;flex:0 0 16px;display:block;object-fit:contain}
  .attr-chip{gap:5px}
  .attr-chip .dot{display:none}
  .rarity{
    display:inline-flex;align-items:center;justify-content:center;
    min-width:40px;height:26px;padding:0 10px;border-radius:8px;
    font-size:13px;font-weight:600;letter-spacing:.4px;color:#fff;
    background:linear-gradient(135deg,color-mix(in srgb,var(--rarity) 76%, #ffffff),var(--rarity));
    box-shadow:0 2px 6px color-mix(in srgb,var(--rarity) 28%, transparent);
  }
  .pic{position:relative;overflow:hidden;background:var(--surface-3)}
  .pic-img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:block}
  .pic-fallback{
    position:absolute;inset:0;display:grid;place-items:center;
    background:
      radial-gradient(circle at 28% 18%, rgba(255,255,255,.85), transparent 34%),
      linear-gradient(145deg,color-mix(in srgb,var(--accent) 20%, #ffffff),color-mix(in srgb,var(--accent) 40%, #dfe7f1));
    color:color-mix(in srgb,var(--accent) 62%, #ffffff);font-size:34px;font-weight:600;
  }
  .kicker{font-size:12.5px;letter-spacing:.16em;color:var(--accent);font-weight:600;text-transform:uppercase}
  .mono{font-family:"SFMono-Regular",Consolas,"Noto Sans Mono",monospace;font-variant-numeric:tabular-nums}
  .id-chip{background:var(--surface-3);border-color:var(--outline);color:var(--muted);font-weight:600}
  .section-head{display:flex;align-items:center;gap:9px;margin:22px 2px 12px}
  .section-bar{width:4px;height:18px;border-radius:3px;background:linear-gradient(180deg,var(--accent),color-mix(in srgb,var(--accent) 40%, #ffffff))}
  .section-title{font-size:19px;font-weight:600;margin:0;letter-spacing:.2px}
  .section-sub{margin-left:auto;font-size:12.5px;color:var(--faint)}
  .divider{height:1px;background:var(--outline-soft);margin:14px 0}
  /* ---------- page header ---------- */
  .page-head{display:flex;align-items:flex-end;justify-content:space-between;gap:20px;margin:2px 2px 16px}
  .head-main{min-width:0}
  .page-title{font-size:30px;line-height:1.25;font-weight:600;margin:5px 0 0;letter-spacing:.2px}
  .page-sub{font-size:14.5px;color:var(--muted);margin-top:5px}
  .page-sub b{color:var(--text);font-weight:600}
  .page-side{flex:0 0 auto;text-align:right;padding-bottom:2px;max-width:420px}
  .count-block{
    display:inline-flex;align-items:baseline;gap:7px;padding:6px 14px;border-radius:12px;
    background:var(--surface);border:1px solid var(--outline);box-shadow:var(--shadow-soft);
  }
  .count-block b{font-size:22px;line-height:1.1;font-weight:600;font-variant-numeric:tabular-nums;color:var(--accent)}
  .count-block span{font-size:12.5px;color:var(--faint)}
  .page-hint{font-size:13px;color:var(--faint);margin-top:7px;line-height:1.5}
  .page-hint b{color:var(--accent);font-weight:600}
  /* ---------- detail ---------- */
  .detail-grid{display:grid;grid-template-columns:420px minmax(0,1fr);gap:18px;align-items:stretch;margin-top:2px}
  .detail-media{display:flex;flex-direction:column;gap:14px;min-width:0}
  .art-card{
    position:relative;border-radius:var(--radius-xl);overflow:hidden;
    background:var(--surface);border:1px solid var(--outline);box-shadow:var(--shadow);
    width:100%;
  }
  .art-card .pic{width:100%}
  .art-card.portrait .pic,.art-card.square .pic{aspect-ratio:1/1}
  /* Support art is published 16:9; forcing a square either crops the sides or
     letterboxes it, so keep the source aspect and let it be wide. */
  .art-card.wide .pic{aspect-ratio:16/9;background:#fff}
  .art-card .pic-img{object-fit:cover}
  .art-card.wide .pic-img{object-fit:contain;background:#fff}
  .art-badge{position:absolute;top:14px;left:14px;z-index:2;display:flex;gap:7px;align-items:center}
  .art-badge.right{left:auto;right:14px}
  .art-caption{
    position:absolute;left:0;right:0;bottom:0;z-index:2;
    padding:42px 16px 14px;color:#fff;font-size:13.5px;letter-spacing:.3px;
    background:linear-gradient(0deg,rgba(16,20,26,.74),rgba(16,20,26,0));
  }
  .info-panel{
    background:var(--surface);border:1px solid var(--outline);
    border-radius:var(--radius-xl);padding:22px 24px;box-shadow:var(--shadow);
    display:flex;flex-direction:column;min-width:0;
  }
  .side-panel{
    background:var(--surface);border:1px solid var(--outline);
    border-radius:var(--radius-lg);padding:13px 15px 14px;box-shadow:var(--shadow-soft);
  }
  .side-title{font-size:12.5px;letter-spacing:.14em;color:var(--faint);font-weight:600;text-transform:uppercase;margin-bottom:8px}
  .title{font-size:30px;line-height:1.25;font-weight:600;margin:5px 0 0;letter-spacing:.2px}
  .subtitle{font-size:15px;color:var(--muted);margin-top:4px}
  .title-ja{font-size:14.5px;color:var(--faint);margin-top:4px}
  .meta-row{display:flex;flex-wrap:wrap;gap:7px;margin-top:13px}
  .meta-list{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px 20px;margin-top:14px}
  .meta-item{min-width:0}
  .meta-label{font-size:12px;color:var(--faint);letter-spacing:.4px}
  .meta-value{font-size:14.5px;color:var(--text);line-height:1.45;overflow-wrap:anywhere}
  .identity-row{margin-top:auto;padding-top:16px;border-top:1px solid var(--outline-soft);display:flex;flex-wrap:wrap;gap:8px;align-items:center}
  /* ---------- difficulty ---------- */
  .diff-grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}
  .diff-card{
    border-radius:var(--radius-md);padding:10px 12px 11px;
    background:color-mix(in srgb,var(--diff) 7%, #ffffff);
    border:1px solid color-mix(in srgb,var(--diff) 22%, #ffffff);
  }
  .diff-top{display:flex;align-items:center;justify-content:space-between;gap:4px}
  .diff-label{font-size:13px;font-weight:600;letter-spacing:.6px;color:color-mix(in srgb,var(--diff) 76%, #17181a)}
  .diff-notes{font-size:11.5px;color:var(--faint);white-space:nowrap}
  .diff-level{font-size:28px;font-weight:600;line-height:1.15;color:color-mix(in srgb,var(--diff) 80%, #17181a);font-variant-numeric:tabular-nums}
  .diff-track{height:5px;border-radius:3px;background:color-mix(in srgb,var(--diff) 14%, #ffffff);margin-top:5px;overflow:hidden}
  .diff-track span{display:block;height:100%;border-radius:3px;background:var(--diff)}
  /* ---------- stats ---------- */
  .stat-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
  .stat{background:var(--surface-2);border:1px solid var(--outline-soft);border-radius:var(--radius-md);padding:11px 13px;min-width:0}
  .stat-label{font-size:12.5px;color:var(--faint);letter-spacing:.4px}
  .stat-value{font-size:21px;font-weight:600;font-variant-numeric:tabular-nums;line-height:1.3}
  .power-row{display:grid;grid-template-columns:64px minmax(0,1fr) 70px;gap:10px;align-items:center;margin-top:10px}
  .power-label{font-size:12.5px;color:var(--muted)}
  .power-value{font-size:13px;text-align:right;font-variant-numeric:tabular-nums;color:var(--text)}
  .bar{height:9px;border-radius:999px;background:var(--surface-3);overflow:hidden;display:block}
  .bar span{display:block;height:100%;border-radius:999px;background:linear-gradient(90deg,color-mix(in srgb,var(--accent) 55%, #9fd0ff),var(--accent))}
  .summary-strip{margin-top:18px;padding-top:14px;border-top:1px solid var(--outline-soft);display:grid;grid-template-columns:repeat(3,minmax(0,1fr))}
  .summary-item{padding:0 16px;border-left:1px solid var(--outline-soft);min-width:0}
  .summary-item:first-child{padding-left:0;border-left:0}
  .summary-label{font-size:12px;color:var(--faint);letter-spacing:.4px}
  .summary-value{font-size:23px;font-weight:600;line-height:1.25;font-variant-numeric:tabular-nums}
  .summary-value small{font-size:12.5px;color:var(--faint);font-weight:400;margin-left:4px}
  .push-bottom{margin-top:auto}
  /* ---------- skills / characters ---------- */
  .skill-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(290px,1fr));gap:12px;align-items:stretch}
  .skill-card{background:var(--surface-2);border:1px solid var(--outline-soft);border-radius:var(--radius-md);padding:13px 15px;display:flex;flex-direction:column}
  .skill-label{font-size:11.5px;color:var(--accent);letter-spacing:.5px;font-weight:600}
  .skill-name{font-size:14.5px;font-weight:600;margin-top:3px;line-height:1.4}
  .skill-desc{font-size:13.5px;color:var(--muted);margin-top:6px;white-space:pre-line;line-height:1.55}
  .char-row{display:flex;flex-wrap:wrap;gap:7px}
  .char-chip{display:inline-flex;align-items:center;gap:6px;padding:4px 10px 4px 4px;border-radius:999px;background:var(--surface-2);border:1px solid var(--outline-soft);font-size:13px;color:var(--muted)}
  .char-face{width:27px;height:27px;border-radius:50%;object-fit:cover;background:var(--surface-3);display:block}
  /* ---------- lists ---------- */
  /* --card-width is computed per result set. A flex row keeps every card the
     same size and centres the final partial row, so a table with one leftover
     entry does not end with three empty columns on the right. */
  .list-grid{display:flex;flex-wrap:wrap;justify-content:center;gap:14px;width:100%}
  .list-grid>.item-card{width:var(--card-width,216px);max-width:var(--card-w,216px)}
  .stamp-grid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:10px;align-items:stretch}
  /* The sticker list keeps its original dense typography and card size. */
  .stamp-grid .item-title{font-size:15.5px}
  .stamp-grid .item-sub{font-size:13px}
  .item-card{
    display:flex;flex-direction:column;
    background:var(--surface);border:1px solid var(--outline);border-radius:var(--radius-lg);
    overflow:hidden;box-shadow:var(--shadow-soft);min-width:0;
  }
  .item-cover{position:relative;background:var(--surface-3);overflow:hidden}
  .item-cover.square{aspect-ratio:1/1}
  /* Support art is 16:9 source: a square crop loses most of the illustration, so
     the list keeps the native aspect and fills the width instead. */
  .item-cover.wide{aspect-ratio:16/9;background:#fff}
  .item-cover.comic{aspect-ratio:1/1;background:#fff}
  .item-cover .pic{position:absolute;inset:0}
  .item-cover .pic-img{object-fit:cover}
  .item-cover.wide .pic-img,.item-cover.comic .pic-img{object-fit:contain;background:#fff}
  .item-body{padding:12px 13px 13px;display:flex;flex-direction:column;flex:1;min-width:0}
  .item-title{
    font-size:17.5px;font-weight:600;line-height:1.45;
    display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;
    min-height:2.9em;
  }
  .item-sub{font-size:14px;color:var(--muted);margin-top:4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .item-foot{display:flex;align-items:center;gap:5px;margin-top:auto;padding-top:10px;flex-wrap:nowrap;overflow:hidden}
  /* Four difficulty chips do not fit one line at this card width; a 2x2 grid
     keeps all four visible and aligned instead of clipping the last one. */
  .item-foot.diffs{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:4px;overflow:visible}
  .item-foot.diffs .mini-diff{justify-content:center}
  .power-chip{font-size:13.5px;padding:4px 9px}
  .power-chip b{color:var(--text);font-weight:600;font-size:14px;font-variant-numeric:tabular-nums}
  .mini-diff{display:inline-flex;align-items:center;gap:3px;padding:2px 6px;border-radius:6px;font-size:12px;font-weight:600;background:color-mix(in srgb,var(--diff) 10%, #ffffff);color:color-mix(in srgb,var(--diff) 76%, #17181a);border:1px solid color-mix(in srgb,var(--diff) 22%, #ffffff);white-space:nowrap}
  .mini-diff b{font-size:13px;font-variant-numeric:tabular-nums}
  .id-tag{
    position:absolute;left:8px;bottom:8px;z-index:2;
    padding:3px 8px;border-radius:6px;
    background:rgba(16,20,26,.7);color:#fff;
    font-size:13px;font-weight:600;letter-spacing:.2px;
    font-variant-numeric:tabular-nums;
  }
  /* ---------- rarity / attribute icons ---------- */
  .rarity-mark{
    position:absolute;right:7px;bottom:7px;z-index:2;
    height:30px;width:auto;display:block;
    filter:drop-shadow(0 2px 5px rgba(0,0,0,.42));
  }
  /* 16:9 support covers are short, so scale the mark to the cover height rather
     than a fixed size — 30px would dominate a short thumbnail. */
  .item-cover.wide .rarity-mark{height:32%;right:6px;bottom:6px}
  .art-card .rarity-mark{height:46px;right:12px;bottom:12px;filter:drop-shadow(0 3px 8px rgba(0,0,0,.45))}
  .corner-badge{position:absolute;top:10px;left:10px;z-index:2}
  .corner-badge.right{left:auto;right:10px}
  /* Attribute chips on covers show the icon only; tighten the pill so it stays
     a compact corner marker instead of a wide capsule. */
  .corner-badge .attr-chip{padding:5px 7px}
  .corner-badge .attr-chip .attr-icon{height:17px;width:17px;flex:0 0 17px}
  .new-badge{display:inline-flex;align-items:center;height:21px;padding:0 8px;border-radius:6px;background:linear-gradient(135deg,#ff7a93,#e0445e);color:#fff;font-size:11px;font-weight:600;letter-spacing:.5px;box-shadow:0 2px 6px rgba(224,68,94,.28)}
  /* ---------- empty ---------- */
  .empty{padding:48px 32px;text-align:center;background:rgba(255,255,255,.88);border:1px dashed #c8d1dc;border-radius:var(--radius-xl);margin-top:14px}
  .empty-icon{font-size:32px;color:var(--accent);opacity:.7}
  .empty-title{font-size:20px;font-weight:600;margin-top:5px}
  .empty-text{font-size:14.5px;color:var(--muted);margin-top:4px}
  .empty-suggest{display:flex;flex-wrap:wrap;justify-content:center;gap:7px;margin-top:12px;font-size:13px;color:var(--faint)}
  .suggest-chip{padding:4px 10px;border-radius:8px;background:var(--surface-2);border:1px solid var(--outline-soft);color:var(--text)}
  /* ---------- catalog ---------- */
  .catalog-hero{
    margin-top:2px;padding:22px 26px;border-radius:var(--radius-xl);position:relative;overflow:hidden;
    background:linear-gradient(135deg,color-mix(in srgb,var(--accent) 88%, #17181a),color-mix(in srgb,var(--accent) 52%, #4c9df0));
    color:#fff;box-shadow:0 14px 34px color-mix(in srgb,var(--accent) 26%, transparent);
  }
  .catalog-hero::after{content:"✦";position:absolute;right:26px;top:0;font-size:104px;line-height:1;opacity:.12}
  .catalog-kicker{font-size:12.5px;letter-spacing:.2em;opacity:.8;font-weight:600}
  .catalog-title{font-size:32px;font-weight:600;line-height:1.2;margin-top:5px}
  .catalog-desc{font-size:14.5px;opacity:.9;margin-top:7px;max-width:760px}
  .catalog-meta{display:flex;flex-wrap:wrap;gap:8px;margin-top:16px}
  .catalog-meta span{padding:5px 12px;border-radius:999px;background:rgba(255,255,255,.16);font-size:12.5px}
  .catalog-meta b{font-weight:600;font-size:14px;margin-left:3px}
  .catalog-grid{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:12px;margin-top:14px}
  .catalog-tile{background:var(--surface);border:1px solid var(--outline);border-radius:var(--radius-lg);padding:15px 16px 13px;box-shadow:var(--shadow-soft);display:flex;flex-direction:column;min-width:0}
  .catalog-tile .icon{font-size:20px;line-height:1}
  .catalog-tile .count{font-size:26px;font-weight:600;margin-top:5px;font-variant-numeric:tabular-nums;line-height:1.15}
  .catalog-tile .label{font-size:13.5px;color:var(--muted);margin-top:1px}
  .catalog-tile .cmd{font-size:12.5px;color:var(--accent);margin-top:9px;padding-top:8px;border-top:1px dashed var(--outline);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .band-table{background:var(--surface);border:1px solid var(--outline);border-radius:var(--radius-lg);padding:4px 18px 6px;box-shadow:var(--shadow-soft)}
  .band-row{display:grid;grid-template-columns:200px minmax(0,1fr) 66px 66px 78px;gap:14px;align-items:center;padding:10px 0;border-bottom:1px solid var(--outline-soft)}
  .band-row:last-child{border-bottom:0}
  .band-head{padding:9px 0 7px;font-size:12px;letter-spacing:.4px;color:var(--faint);border-bottom:1px solid var(--outline)}
  .band-head>div:nth-child(n+3){text-align:right}
  .band-name{display:flex;align-items:center;gap:8px;font-size:14.5px;font-weight:500;min-width:0}
  .band-name .dot{width:9px;height:9px;border-radius:50%;flex:0 0 9px}
  .band-name span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .band-bar{height:9px;border-radius:999px;background:var(--surface-3);overflow:hidden}
  .band-bar span{display:block;height:100%;border-radius:999px;background:var(--band)}
  .band-num{font-size:14px;color:var(--muted);text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
  .band-num b{color:var(--text);font-weight:600}
  .rarity-row{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}
  .rarity-card{background:var(--surface);border:1px solid var(--outline);border-radius:var(--radius-md);padding:12px 15px;box-shadow:var(--shadow-soft);min-width:0}
  .rarity-card .label{font-size:13.5px;font-weight:600;color:color-mix(in srgb,var(--rarity) 78%, #17181a);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .rarity-card .count{font-size:23px;font-weight:600;margin-top:2px;font-variant-numeric:tabular-nums}
  .latest-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
  .latest-card{background:var(--surface);border:1px solid var(--outline);border-radius:var(--radius-lg);padding:4px 16px 6px;box-shadow:var(--shadow-soft);min-width:0}
  .latest-row{display:flex;align-items:center;gap:10px;padding:9px 0;border-bottom:1px solid var(--outline-soft)}
  .latest-row:last-child{border-bottom:0}
  .latest-head{border-bottom:1px solid var(--outline);padding:9px 0 7px}
  .latest-head .latest-main{font-size:12.5px;color:var(--faint);letter-spacing:.5px}
  .latest-thumb{width:44px;height:44px;border-radius:9px;overflow:hidden;flex:0 0 44px;background:var(--surface-2)}
  .latest-thumb img{width:100%;height:100%;object-fit:cover;display:block}
  .latest-thumb.tall{width:56px;flex-basis:56px}
  .latest-main{min-width:0;flex:1}
  .latest-title{font-size:14.5px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .latest-sub{font-size:12.5px;color:var(--faint);margin-top:1px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .latest-date{font-size:12px;color:var(--faint);font-variant-numeric:tabular-nums;white-space:nowrap}
  /* ---------- help ---------- */
  .help-card{background:var(--surface);border:1px solid var(--outline);border-radius:var(--radius-xl);padding:22px 26px 24px;box-shadow:var(--shadow);margin-top:2px}
  .help-title{font-size:31px;font-weight:600;line-height:1.25;margin:5px 0 0}
  .help-intro{font-size:14.5px;color:var(--muted);line-height:1.75}
  .help-card>.help-intro{margin-top:10px}
  .help-table{width:100%;border-collapse:collapse;margin-top:16px}
  .help-table th{text-align:left;font-size:12.5px;letter-spacing:.5px;color:var(--faint);font-weight:500;padding:8px 12px;border-bottom:1px solid var(--outline)}
  .help-table td{padding:10px 12px;border-bottom:1px solid var(--outline-soft);font-size:14.5px;vertical-align:top;line-height:1.6}
  .help-table tr:last-child td{border-bottom:0}
  .cmd-code{display:inline-block;padding:2px 8px;border-radius:6px;background:var(--primary-soft);border:1px solid #cfe4f8;color:var(--primary-deep);font-family:"SFMono-Regular",Consolas,"Noto Sans Mono",monospace;font-size:13px;white-space:nowrap}
  .region-grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px;margin-top:16px}
  .region-card{border:1px solid var(--outline);border-radius:var(--radius-md);padding:12px 14px;background:var(--surface-2);min-width:0}
  .region-card b{display:block;font-size:15px}
  .region-card span{font-size:13px;color:var(--muted)}
  .region-card code{font-size:13px;color:var(--accent)}
  .help-tips{margin-top:18px;padding-top:15px;border-top:1px solid var(--outline-soft);font-size:14px;color:var(--muted);line-height:1.85}
  .help-tips b{color:var(--text)}
  .help-tips .tip-line{display:block}
  /* ---------- footer ---------- */
  .footer{
    display:flex;align-items:center;justify-content:space-between;gap:12px;
    margin-top:20px;padding:10px 2px 0;border-top:1px solid #dbe2ea;
    color:#8a929c;font-size:12.5px;letter-spacing:.2px;
  }
  .footer b{color:#69727c;font-weight:600}
  .footer .right{white-space:nowrap}
</style>
</head>
<body>
<div class="page">
  {% block content %}{% endblock %}

  <footer class="footer">
    <span><b>汐见萤Bot</b> · {{ region.label }}{% if script_label %} · {{ script_label }}{% endif %}{% if command_label %} · {{ command_label }}{% endif %}</span>
    <span class="right">Designed by 慵懒午睡</span>
  </footer>
</div>
</body>
</html>
